version: "3.8"

# Common OpenTelemetry env vars shared by every service.
# Values come from the .env file (copy .env.example -> .env and fill in).
x-otel-common: &otel-common
  OTEL_EXPORTER_OTLP_ENDPOINT: ${DT_OTLP_ENDPOINT}
  OTEL_EXPORTER_OTLP_HEADERS: Authorization=Api-Token ${DT_API_TOKEN}
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_METRIC_EXPORT_INTERVAL: 15000
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=ecommerce-demo,deployment.environment=dev"

services:
  customer-service:
    build: ./customer-service
    ports:
      - "8081:8081"
    environment:
      <<: *otel-common
      OTEL_SERVICE_NAME: customer-service

  payment-service:
    build: ./payment-service
    ports:
      - "8082:8082"
    environment:
      <<: *otel-common
      OTEL_SERVICE_NAME: payment-service

  order-service:
    build: ./order-service
    ports:
      - "8080:8080"
    environment:
      <<: *otel-common
      OTEL_SERVICE_NAME: order-service
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8082
    depends_on:
      - customer-service
      - payment-service
